include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"     # Excludes code generated by riverpod_generator
    - "**/*.freezed.dart"

# Optional: Customize specific lint rules here if needed
linter:
  rules:
    avoid_print: true
